<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bộ câu hỏi ôn luyện IC3/MOS</title>

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://script.google.com">

<style>
html,body{margin:0;height:100%;background:#e6f0fb;font-family:"Segoe UI",system-ui,sans-serif;color:#17233b;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .3s}
iframe.on{opacity:1}
#ld{position:fixed;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:#e6f0fb;transition:opacity .3s;padding:20px}
#ld.off{opacity:0;pointer-events:none}
.logo{width:76px;height:76px;border-radius:18px;background:#d9262c;color:#fff;font:800 28px/76px "Segoe UI",sans-serif;box-shadow:0 8px 24px #d9262c44}
h1{margin:6px 0 0;font-size:24px}
.bar{width:min(340px,80vw);height:8px;border-radius:99px;background:#c9dcf3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2f6fdb;border-radius:99px;transition:width .2s}
#tx{margin:0;color:#4a5a78;font-size:15px}
#tx a{color:#2f6fdb;font-weight:600}
#fs{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;border:0;border-radius:99px;padding:7px 16px;background:#0f2347cc;color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="ld">
  <div class="logo">IC3</div>
  <h1>Bộ câu hỏi ôn luyện IC3/MOS</h1>
  <div class="bar"><i id="pg"></i></div>
  <p id="tx">Đang tải bài luyện tập, vui lòng đợi giây lát...</p>
</div>

<iframe id="app" allow="fullscreen" allowfullscreen title="Bộ câu hỏi ôn luyện IC3/MOS"></iframe>
<button id="fs">⛶ Toàn màn hình</button>

<script>
// DÁN LINK /exec CỦA WEB HỌC SINH VÀO ĐÂY
const URL_APP = 'https://script.google.com/macros/s/AKfycbxLK4VTTPtSec8E8y5GTFqrsjEEHb-80YaR0KWv-7AivHkIRTXaOrRL2cIhBgmTbG5i/exec';

const f = document.getElementById('app'),
      pg = document.getElementById('pg'),
      ld = document.getElementById('ld'),
      tx = document.getElementById('tx'),
      fs = document.getElementById('fs');

let p = 10;
pg.style.width = p + '%';

// Thanh bar chạy đều đặn trong khoảng 3 giây
const timer = setInterval(() => {
  if (p < 96) {
    p += (96 - p) * 0.1;
    pg.style.width = p + '%';
  }
}, 120);

let loaded = false;

function showApp() {
  if (loaded) return;
  loaded = true;
  clearInterval(timer);
  pg.style.width = '100%';
  setTimeout(() => {
    ld.classList.add('off');
    f.classList.add('on');
  }, 200);
  if (document.documentElement.requestFullscreen) {
    fs.style.display = 'block';
  }
}

f.onload = showApp;

// Chuyển tiếp tham số URL (ví dụ ?pc=HS37)
f.src = URL_APP + location.search;

// TỰ ĐỘNG BẬT TRANG SAU 3 GIÂY (3000ms) - Đảm bảo bên trong đã load kịp giao diện đăng nhập
setTimeout(showApp, 3000);

// Fallback phụ phòng hờ mạng nghẽn thực sự lâu (sau 15 giây mới hiện dòng cảnh báo tải lại)
setTimeout(() => {
  if (!loaded) {
    tx.innerHTML = 'Tải lâu hơn bình thường. <a href="#" onclick="location.reload();return false">Tải lại</a> · <a href="' + URL_APP + location.search + '">Mở trực tiếp</a>';
  }
}, 15000);

fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange', () => {
  fs.textContent = document.fullscreenElement ? '⛶ Thoát toàn màn hình' : '⛶ Toàn màn hình';
});
</script>
</body>
</html>
