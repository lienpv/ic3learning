<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IC3 Learning :: Quản trị</title>

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://script.google.com">

<style>
html,body{margin:0;height:100%;background:#e6f0fb;font-family:"Segoe UI",system-ui,sans-serif;color:#17233b;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .2s}
iframe.on{opacity:1}
#ld{position:fixed;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:#e6f0fb;transition:opacity .25s;padding:20px}
#ld.off{opacity:0;pointer-events:none}
.logo{width:76px;height:76px;border-radius:18px;background:#d9262c;color:#fff;font:800 28px/76px "Segoe UI",sans-serif;box-shadow:0 8px 24px #d9262c44}
h1{margin:6px 0 0;font-size:24px}
.bar{width:min(340px,80vw);height:8px;border-radius:99px;background:#c9dcf3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2f6fdb;border-radius:99px;transition:width .15s}
#tx{margin:0;color:#4a5a78;font-size:15px}
#fs{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;border:0;border-radius:99px;padding:7px 16px;background:#0f2347cc;color:#fff;font:600 13px "Segoe UI",sans-serif;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="ld">
  <div class="logo">IC3</div>
  <h1>IC3 Learning :: Quản trị</h1>
  <div class="bar"><i id="pg"></i></div>
  <p id="tx">Đang tải trang quản trị, vui lòng đợi giây lát...</p>
</div>

<iframe id="app" allow="fullscreen" allowfullscreen title="IC3 Learning :: Quản trị"></iframe>
<button id="fs">⛶ Toàn màn hình</button>

<script>
const URL_APP = 'https://script.google.com/macros/s/AKfycbyLAdzzwhSJ80mlypxWOLOsNw25q2pUA4jmME1sKsaGalOXtvfo3sl908HHqXoustOB0Q/exec';

const f = document.getElementById('app'), 
      pg = document.getElementById('pg'),
      ld = document.getElementById('ld'), 
      fs = document.getElementById('fs');

let p = 25; // Khởi đầu ở mức 25%
pg.style.width = p + '%';

// Thanh bar chạy chớp nhoáng
const timer = setInterval(() => { 
  if (p < 98) {
    p += (98 - p) * 0.6; 
    pg.style.width = p + '%'; 
  }
}, 50);

let loaded = false;

function showApp() {
  if (loaded) return;
  loaded = true;
  clearInterval(timer);
  pg.style.width = '100%';
  setTimeout(() => {
    ld.classList.add('off');
    f.classList.add('on');
  }, 100);
  if (document.documentElement.requestFullscreen) {
    fs.style.display = 'block';
  }
}

f.onload = showApp;
f.src = URL_APP;

// TỰ ĐỘNG BẬT TRANG SAU 600ms (0.6 giây)
setTimeout(showApp, 600);

fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange', () => { 
  fs.textContent = document.fullscreenElement ? '⛶ Thoát toàn màn hình' : '⛶ Toàn màn hình'; 
});
</script>
</body>
</html>
