<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Bộ câu hỏi ôn luyện IC3/MOS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
:root{--navy:#0f2347;--blue:#2f7de1;--red:#d9262c;--teal:#1d5668;--ink:#17233b}
body{background:#e6ebf2;color:var(--ink);min-height:100vh}
.hero{background:var(--navy);color:#fff;padding:26px 20px;text-align:center;font-size:24px}
.card-main{width:60vw;min-width:min(620px,94vw);max-width:94vw;margin:-14px auto 24px;border:0;border-top:4px solid var(--red);border-radius:14px;box-shadow:0 6px 24px #0f234722}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}.btn-red:hover,.btn-red:focus{background:#b81d23;border-color:#b81d23;color:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}.steps span{padding:6px 14px;border-radius:99px;background:#eef2f8;color:#58657d;font-weight:600;font-size:14px}.steps .on{background:#fde8e8;color:var(--red)}
.bar{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:8px;flex-wrap:wrap}
.mini{background:#ffffff22;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}.mini.red{background:var(--red)}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:20px;max-width:1500px;margin:16px auto;padding:0 16px}
.qcard,.out{background:#fff;border-radius:10px;box-shadow:0 4px 18px #0f234718;height:calc(100vh - 100px);min-height:560px}
.qcard{padding:18px 18px 0;display:flex;flex-direction:column}
.qh{display:flex;justify-content:space-between;color:#58657d;font-size:15px;margin-bottom:10px}
.bmk{background:none;border:0;font-size:18px;opacity:.3;cursor:pointer}.bmk.on{opacity:1}
.qt{background:var(--teal);color:#fff;padding:16px 18px;font-size:26px;line-height:1.4}
.qbody{flex:1;min-height:0;overflow:auto;background:#fbfcfe}.opts{padding:12px 6px}
.op{display:flex;gap:12px;align-items:center;padding:10px 14px;font-size:23px;cursor:pointer;border-radius:8px}.op:hover{background:#eef3fb}
.op input{width:26px;height:26px;flex:none;accent-color:var(--blue)}.op:has(input:checked){background:#e8f0fe;border-color:var(--blue)}
.opts.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px 10px}
.opts.two .op{align-items:flex-start;border:1px solid #dde3ec;background:#fff}.opts.two .op input{margin-top:3px}
.gr{display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:22px}.gr select{width:auto;min-width:190px;font-size:20px}
.foot{display:flex;justify-content:space-between;align-items:center;margin:14px -18px 0;padding:12px 18px;background:#e6eaf0;border-radius:0 0 10px 10px;color:#4a566c;gap:8px;flex-wrap:wrap}
.out{padding:0 0 8px;overflow:auto;position:relative}.tab{position:sticky;top:0;background:#fff;z-index:1;padding:12px 18px;font-weight:700;color:var(--blue);border-bottom:2px solid var(--blue)}
.it{display:flex;gap:10px;padding:9px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #eef1f6}.it:hover{background:#f2f6fc}.it.cur{background:#dfe6f2}
.it i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:#e4e9f1;display:grid;place-items:center;font-size:12px;font-weight:700}.it.done i{background:var(--blue);color:#fff}
.out,.qbody{scrollbar-width:thin;scrollbar-color:#d3dae5 transparent}.out::-webkit-scrollbar,.qbody::-webkit-scrollbar{width:6px}.out::-webkit-scrollbar-thumb,.qbody::-webkit-scrollbar-thumb{background:#d3dae5;border-radius:6px}
.qimg{display:block;max-width:100%;max-height:190px;margin:12px auto;border-radius:8px;cursor:zoom-in}
.oimg{display:block;max-height:90px;max-width:160px;margin-top:8px;border-radius:6px;border:1px solid #dde3ec;cursor:zoom-in}
.hotw{text-align:center;padding:10px}.hotb{position:relative;display:inline-block;max-width:100%}
img.hot{display:block;max-width:100%;max-height:calc(100vh - 420px);min-height:200px;cursor:crosshair;user-select:none}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#e8332a;border:3px solid #fff;box-shadow:0 0 0 2px #e8332a,0 2px 6px #0006;cursor:pointer}
.hint{color:#58657d;font-size:15px;margin:8px 0 0}
.ov{position:fixed;inset:0;background:#0f234788;display:grid;place-items:center;z-index:9}
.md{background:#fff;border-radius:6px;padding:26px 30px;max-width:560px;width:92%;box-shadow:0 10px 40px #0004;text-align:center}
.qi{width:46px;height:46px;border:3px solid #5b6b86;border-radius:50%;display:inline-grid;place-items:center;font:700 26px/1 sans-serif;color:#5b6b86;margin-bottom:10px}
.mt{font-size:18px}.mb{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.zm{background:#000c;cursor:zoom-out}.zm img{max-width:94vw;max-height:90vh;background:#fff;border-radius:8px}
.zx{position:fixed;top:14px;right:18px;background:#fff;border:0;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
.res{position:relative;overflow:hidden;text-align:center;padding:40px 20px 32px}.res>*{position:relative;z-index:1}
.res::before,.res::after{content:"";position:absolute;border-radius:60px;transform:rotate(-28deg)}
.res::before{right:-70px;top:50px;width:330px;height:76px;background:#7cc4f0}.res::after{left:-90px;bottom:110px;width:330px;height:84px;background:#e98bb3}
.res h2{font-weight:800;font-size:34px}.res .sc{font-size:56px;font-weight:800}.res .ok{color:#6cbf1e}.res .no{color:#c0504d}
.thx{font-size:44px;font-weight:800;color:#c27fc9;margin-top:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.qcard,.out{height:auto}.out{max-height:340px}.qbody{overflow:visible}.opts.two{grid-template-columns:1fr}.card-main{width:94vw}}
.hbtn{position:fixed;top:14px;left:14px;z-index:20;width:46px;height:46px;border:0;border-radius:10px;background:#ffffff26;color:#fff;font-size:26px;line-height:1;cursor:pointer}.hbtn:hover{background:#ffffff40}
.hback{position:fixed;inset:0;background:#0f234766;z-index:30;opacity:0;visibility:hidden;transition:opacity .25s}.hback.open{opacity:1;visibility:visible}
.hpanel{position:fixed;top:0;bottom:0;left:0;width:25vw;min-width:300px;max-width:480px;background:#fff;z-index:31;transform:translateX(-100%);transition:transform .28s ease;box-shadow:6px 0 30px #0003;display:flex;flex-direction:column}.hpanel.open{transform:none}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:3px solid var(--red)}
.hbody{flex:1;overflow:auto;padding:14px 16px}
.hgrp{border:1px solid #e1e6ee;border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fbfcfe}
.hrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px 10px;margin-top:6px;border-radius:8px;border:1px solid #b9c1ce;background:#f1f3f6}
.hrow.hok{background:#e8f7e6;border-color:#4caf50}.hrow.hno{background:#fdeaea;border-color:#d9534f}
.rl{font-size:14px;color:var(--blue);text-decoration:none;font-weight:600}.rl:hover{text-decoration:underline}.rl.off{color:#9aa5b8;pointer-events:none}
@media(max-width:991px){.hpanel{width:50vw;min-width:260px}}
.cbx{position:relative}.cbv{text-align:left;cursor:pointer}.cbv:disabled{background-color:#e9ecef;cursor:not-allowed}
.cbp{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #cfd8e6;border-radius:10px;box-shadow:0 10px 30px #0f23473a;z-index:15;padding:10px}.cbp[hidden]{display:none}
.cbl{max-height:min(46vh,360px);overflow:auto;margin-top:8px;scrollbar-width:thin;scrollbar-color:#d3dae5 transparent}
.cbc{column-count:3;column-gap:8px}
.cbi{padding:7px 10px;border-radius:6px;cursor:pointer;break-inside:avoid;font-size:17px}.cbi:hover{background:#eef3fb}.cbi.on{background:var(--blue);color:#fff}
.cbg{font-weight:700;color:var(--teal);padding:8px 4px 4px;font-size:14px}.cbn{padding:14px;text-align:center;color:#58657d}
@media(max-width:900px){.cbc{column-count:1}}
.tkb{display:flex;gap:8px;align-items:stretch}
.tkt{flex:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#eaf2fd;border:1px solid #9fc3f0;border-radius:99px;padding:8px 18px;font-size:16px}
.tkt.tkon{cursor:pointer}.tkt .progress{flex:1;min-width:120px;height:10px}
.tkx{flex:none;min-width:46px;background:#eaf2fd;border:1px solid #9fc3f0;border-radius:99px;color:var(--blue);font-weight:700;padding:0 16px}
.tkx.tkon{cursor:pointer}.tkx:hover{background:#d8e7fb}
.tkt.warn,.tkx.warn{background:#fff3e0;border-color:#ffb74d;color:#8a5200}.tkx.tkre{color:#8a5200;cursor:pointer}.tkx.tkre:hover{background:#ffe6c2}
.tkd{margin-top:10px;border:1px solid #cfe0f7;border-radius:14px;background:#f6faff;padding:10px 14px}
.tkr{padding:8px 0;border-bottom:1px solid #e3ecf8}.tkr:last-of-type{border-bottom:0}
.tkr .progress{height:8px;margin-top:6px}.tkr.ok .nm{color:#2e7d32}
.tkw{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px}.tkw .progress{width:150px;height:10px;background:#ffffff40}
</style></head><body><div id="app"></div>
<script>
// DÁN LINK /exec CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
const BASE_URL = 'https://script.google.com/macros/s/AKfycbxrwMRUJEg0A8UGUTLt0QH-_q7Fw6ogrFDXod4U16bdNAGYPykRSlv4Wf-Qyp6JHmiQsA/exec';

const urlParams = new URLSearchParams(window.location.search);
const PC_RAW = urlParams.get('pc') || urlParams.get('may') || '';

const SHUFFLE_Q=true,SHUFFLE_OPT=true,SHOW_BOOKMARK=true;
const KEEP=/tất cả|đáp án trên|cả hai|all of the above|none of the above/i;
const PCMAY=(()=>{const m=String(PC_RAW).match(/(\d+)(?!.*\d)/),n=m?+m[1]:0;return n>=1&&n<=50?String(n):''})();
const S={tests:[],ans:{},bm:{},i:0,sel:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Thay thế google.script.run bằng Fetch API siêu tốc gọi trực tiếp tới GAS Backend
async function call(action, data = {}) {
  try {
    let res;
    if (action === 'submit' || action === 'report') {
      res = await fetch(BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...data })
      });
    } else {
      const params = new URLSearchParams({ action, ...data });
      res = await fetch(`${BASE_URL}?${params.toString()}`);
    }
    const json = await res.json();
    if (json.err) throw new Error(json.err);
    return json;
  } catch (e) {
    throw e;
  }
}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cl=t=>String(t).replace(/^\s*\d+\s*[\.\):]\s+/,'');
function mix(items){
  items=items.map(q=>{q=Object.assign({},q);
    if(SHUFFLE_OPT){
      if(q.t=='grid')q.r=shuf(q.r);
      else if(q.o){const idx=q.o.map((_,j)=>j),fx=idx.filter(j=>KEEP.test(q.o[j])),ord=shuf(idx.filter(j=>!fx.includes(j))).concat(fx);
        q.o=ord.map(j=>q.o[j]);if(q.oi)q.oi=ord.map(j=>q.oi[j])}}
    return q});
  return SHUFFLE_Q?shuf(items):items}
const view=h=>{$('#app').html(h);scrollTo(0,0)};
const hero='<div class="hero"><b>Bộ câu hỏi ôn luyện IC3/MOS</b></div>';
function modal(msg,ok,cancel,icon){return new Promise(res=>{
  const d=$(`<div class="ov"><div class="md"><div class="qi">${icon||'?'}</div><div class="mt">${msg}</div><div class="mb"><button class="btn btn-primary fw-bold" id="mo">${ok}</button>${cancel?`<button class="btn btn-primary fw-bold" id="mc">${cancel}</button>`:''}</div></div></div>`).appendTo('body');
  d.find('#mo').on('click',()=>{d.remove();res(true)});d.find('#mc').on('click',()=>{d.remove();res(false)})})}
function busy(){const d=$('<div class="ov"><div class="md"><div class="mt fw-bold fs-5">Đang chấm bài, vui lòng đợi giây lát...</div><div class="progress mt-3" style="height:12px"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div></div></div>').appendTo('body');return()=>d.remove()}
function zoom(src){const d=$(`<div class="ov zm"><img src="${src}"><button class="zx">✕</button></div>`).appendTo('body').on('click',()=>d.remove())}
$(document).on('click','img.qimg,img.oimg',function(e){e.preventDefault();e.stopPropagation();zoom(this.src)});
$(document).on('keydown',e=>{if(e.key=='Escape')$('.zm').remove()});
document.addEventListener('fullscreenchange',()=>$('#fs').text(document.fullscreenElement?'Thoát toàn màn hình':'Toàn màn hình'));

const noDau=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
$(document).on('mousedown',e=>{$('.cbx').each(function(){if(!this.contains(e.target))$(this).find('.cbp').attr('hidden',true)})});
function combo(sel,ph,pick){
  const el=$(sel).addClass('cbx').html('<button type="button" class="form-select form-select-lg cbv"></button><div class="cbp" hidden><input class="form-control cbs" placeholder="Gõ để tìm..." autocomplete="off"><div class="cbl"></div></div>');
  const b=el.find('.cbv'),p=el.find('.cbp'),q=el.find('.cbs'),l=el.find('.cbl');
  let items=[],val='',ph0=ph,vis=[];
  const paint=()=>{const it=items.find(x=>x.v===val);b.text(it?it.l:ph0).toggleClass('text-secondary',!it)};
  const list=()=>{const k=noDau(q.val().trim());vis=items.filter(x=>noDau(x.l).includes(k));
    if(!vis.length){l.html('<div class="cbn">Không tìm thấy</div>');return}
    const gs=[];vis.forEach(x=>{let g=gs.find(y=>y.g===(x.g||''));if(!g)gs.push(g={g:x.g||'',a:[]});g.a.push(x)});
    l.html(gs.map(g=>(g.g?`<div class="cbg">${esc(g.g)}</div>`:'')+'<div class="cbc">'+g.a.map(x=>`<div class="cbi${x.v===val?' on':''}" data-v="${esc(x.v)}">${esc(x.l)}</div>`).join('')+'</div>').join(''))};
  const close=()=>p.attr('hidden',true);
  const choose=v=>{val=v;paint();close();pick&&pick(v)};
  b.on('click',()=>{if(!p.attr('hidden')){close();return}q.val('');list();p.removeAttr('hidden');q.trigger('focus');const c=l.find('.cbi.on')[0];if(c)l[0].scrollTop=Math.max(0,c.offsetTop-60)});
  q.on('input',list).on('keydown',e=>{if(e.key=='Enter'){e.preventDefault();if(vis.length==1)choose(vis[0].v)}else if(e.key=='Escape')close()});
  l.on('click','.cbi',function(){choose($(this).attr('data-v'))});
  paint();
  return{items(a){items=a;paint()},val(v){if(v===undefined)return val;val=v;paint()},ph(t){ph0=t;paint()},dis(d){b.prop('disabled',!!d)}};
}
let LP,NC;
function loginV(){
  const s=S.sel,gl=[];
  for(const k of [3,4,5])for(let i=1;i<=12;i++)gl.push({v:k+'.'+i,l:k+'.'+i,g:'Khối '+k});
  view(`${hero}<main class="card card-main"><div class="card-body p-4 p-md-5"><h2 class="fw-bold">Đăng nhập</h2><p class="text-secondary">Chọn lớp, rồi chọn họ và tên của em. Có thể gõ để tìm nhanh.</p>
  <label class="form-label fw-semibold mt-2">Lớp</label><div id="lp"></div>
  <div class="d-flex justify-content-between align-items-end mt-3 mb-2"><label class="form-label fw-semibold mb-0">Họ và tên</label><a href="#" class="rl off" id="rl">↻ Tải lại danh sách</a></div><div id="nm"></div>
  <p class="text-danger fw-semibold mt-3 mb-0" id="err" style="min-height:24px"></p>
  <div class="d-flex justify-content-end mt-2"><button class="btn btn-red btn-lg px-4" id="go">Vào học</button></div></div></main>`);
  NC=combo('#nm','— Chọn lớp trước —',v=>{S.sel.name=v});NC.dis(true);
  LP=combo('#lp','— Chọn lớp —',v=>{S.sel.lop=v;S.sel.name='';NC.val('');$('#err').text('');$('#rl').toggleClass('off',!v);v?loadNames(v):(NC.items([]),NC.ph('— Chọn lớp trước —'),NC.dis(true))});
  LP.items(gl);LP.val(s.lop||'');$('#rl').toggleClass('off',!s.lop);if(s.lop)loadNames(s.lop,s.name);
  $('#rl').on('click',e=>{e.preventDefault();reloadNames()});
  $('#go').on('click',async()=>{const lop=LP.val(),name=NC.val(),may=PCMAY||PC_RAW;
    if(!lop||!name){$('#err').text('Hãy chọn lớp và họ và tên của em.');return}
    $('#go').prop('disabled',true).text('Đang vào...');
    try{if(S.sel.done!==lop){S.sel.mon=false;S.sel.bt=''}S.sel.lop=lop;S.sel.name=name;S.sel.may=may;S.sel.done=lop;
      S.name=name;S.lop=lop;S.khoi=lop.split('.')[0];if(!S.tests.length){const c=LS.get('tests2');if(c){S.tests=c;call('getTests').then(t=>{S.tests=t;LS.set('tests2',t)}).catch(()=>{})}else{S.tests=await call('getTests');LS.set('tests2',S.tests)}}histPurge();taskCache();selectV();histSync()}
    catch(e){$('#err').text('Không kết nối được máy chủ. Hãy thử lại.');$('#go').prop('disabled',false).text('Vào học')}});
}
const LS={get(k){try{return JSON.parse(localStorage.getItem('ic3_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('ic3_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('ic3_'+k)}catch(e){}}},NM={};
function fillNames(L,keep){const cur=NC.val()||keep;
  NC.items(L.map(x=>({v:x,l:x})));NC.ph('— Chọn họ và tên —');NC.dis(!L.length);
  $('#err').text(L.length?'':'Lớp này chưa có danh sách học sinh. Hãy báo giáo viên.');NC.val(cur&&L.includes(cur)?cur:'')}
async function loadNames(lop,keep){
  if(NM[lop]){fillNames(NM[lop],keep);return}
  const c=LS.get('ds_'+lop);
  if(c)fillNames(c,keep);else{NC.items([]);NC.val('');NC.ph('Đang tải danh sách...');NC.dis(true)}
  try{const L=await call('getStudents',{lop});NM[lop]=L;LS.set('ds_'+lop,L);if(LP.val()===lop&&JSON.stringify(L)!==JSON.stringify(c))fillNames(L,keep)}
  catch(e){if(!c){NC.ph('— Không tải được danh sách —');$('#err').text('Không tải được danh sách học sinh. Hãy thử lại.')}}}
let RLING=false;
async function reloadNames(){
  const lop=LP.val();if(!lop||RLING)return;RLING=true;
  const a=$('#rl').addClass('off').text('Đang tải...'),say=(t,ok)=>{a.text(t);setTimeout(()=>{RLING=false;$('#rl').text('↻ Tải lại danh sách').toggleClass('off',!LP.val())},ok?2000:2500)};
  try{const L=await call('getStudents',{lop,force:true});delete NM[lop];LS.del('ds_'+lop);NM[lop]=L;LS.set('ds_'+lop,L);
    if(LP.val()===lop)fillNames(L,NC.val());say('Đã cập nhật ✓',true)}
  catch(e){say('Không tải được, thử lại',false)}}

function histInit(){
  $('#app').append(`<button class="hbtn" id="hbtn" title="Lịch sử làm bài hôm nay" aria-label="Lịch sử làm bài hômujourd">☰</button><div class="hback" id="hback"></div>
  <aside class="hpanel" id="hpanel"><div class="hhead"><div><div class="fw-bold fs-5">Lịch sử làm bài hôm nay</div><div class="small text-secondary">${esc(S.name)} · lớp ${esc(S.lop)}</div></div><button class="btn-close mt-1" id="hx" aria-label="Đóng"></button></div><div class="hbody" id="hbody"><div class="tkhost mb-3"></div><div id="hlist"></div></div></aside>`);
  $('#hbtn').on('click',()=>{$('#hpanel,#hback').addClass('open');histLoad()});
  $('#hx,#hback').on('click',histClose);taskPaint();
  $(document).off('keydown.hist').on('keydown.hist',e=>{if(e.key=='Escape')histClose()});
}
function histClose(){$('#hpanel,#hback').removeClass('open')}
const pad2=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const hkey=(n,l)=>'hist_'+l+'_'+n;
function histCache(){const c=LS.get(hkey(S.name,S.lop));return c&&c.d===today()&&Array.isArray(c.g)?c.g:null}
function histPurge(){try{Object.keys(localStorage).filter(k=>k.indexOf('ic3_hist_')==0||k.indexOf('ic3_task_')==0).forEach(k=>{let v=null;try{v=JSON.parse(localStorage.getItem(k))}catch(e){}if(!v||v.d!==today())localStorage.removeItem(k)})}catch(e){}}
const tkey=(n,l)=>'task_'+l+'_'+n;
function taskCache(){const c=LS.get(tkey(S.name,S.lop));S.tkErr=false;if(c&&c.d===today()){S.task=c.task;S.rep=c.rep||''}else{S.task=undefined;S.rep=''}}
function taskSave(){LS.set(tkey(S.name,S.lop),{d:today(),task:S.task,rep:S.rep})}
const taskItem=id=>S.task?S.task.items.find(x=>x.id===id):null;
async function histSync(){const n=S.name,l=S.lop;
  try{const b=await call('getBoot',{name:n,lop:l});LS.set(hkey(n,l),{d:today(),g:b.hist});
    if(S.name===n&&S.lop===l){S.task=b.task;S.rep=b.rep||'';S.tkErr=false;taskSave();taskPaint()}else LS.set(tkey(n,l),{d:today(),task:b.task,rep:b.rep||''});
    return b.hist}
  catch(e){if(S.name===n&&S.task===undefined){S.tkErr=true;taskPaint()}return null}}
function taskHtml(){const t=S.task;
  if(t===undefined)return S.tkErr?'<div class="tkb"><div class="tkt warn">Không tải được nhiệm vụ bài học.</div><button class="tkx warn tkre">↻ Tải lại</button></div>':'<div class="tkb"><div class="tkt">Đang tải nhiệm vụ bài học...</div></div>';
  if(t===null)return `<div class="tkb"><div class="tkt warn">Hôm nay giáo viên chưa giao bài.</div><button class="tkx warn tkre">${S.tkBusy?'Đang tải...':'↻ Tải lại'}</button></div>`;
  const tot=t.items.reduce((a,x)=>a+x.times,0),ok=t.items.reduce((a,x)=>a+x.ok,0),all=ok>=tot,pc=n=>Math.round(n*100);
  let h=`<div class="tkb"><div class="tkt tkon"><span>Nhiệm vụ bài học: đã đạt <b>${ok}/${tot}</b> lần${all?' ✓':''}</span><div class="progress"><div class="progress-bar${all?' bg-success':''}" style="width:${pc(ok/tot)}%"></div></div></div><button class="tkx tkon" aria-label="Mở rộng">${S.tkopen?'▲':'▼'}</button></div>`;
  if(S.tkopen)h+='<div class="tkd">'+t.items.map(x=>{const d=x.ok>=x.times;return`<div class="tkr${d?' ok':''}"><div class="d-flex justify-content-between gap-2"><span class="nm fw-semibold">${d?'✓ ':''}${esc(x.cd)} - ${esc(x.t)}</span><span class="small text-secondary text-nowrap">${x.ok}/${x.times} lần · từ ${x.thr} điểm</span></div><div class="progress"><div class="progress-bar${d?' bg-success':''}" style="width:${pc(x.ok/x.times)}%"></div></div></div>`}).join('')+
    `<div class="text-center mt-2">${S.rep?`<button class="btn btn-success fw-bold" disabled>Đã báo lúc ${esc(S.rep)} ✓</button>`:`<button class="btn btn-red tkrep"${all?'':' disabled'}>Báo giáo viên đã hoàn thành</button>`}</div></div>`;
  return h}
function taskPaint(){$('.tkhost').html(taskHtml());if($('#bt').length)fillBt()}
async function taskReload(){if(S.tkBusy)return;S.tkBusy=true;S.tkErr=false;taskPaint();await histSync();S.tkBusy=false;taskPaint()}
$(document).on('click','.tkon',()=>{S.tkopen=!S.tkopen;taskPaint()});$(document).on('click','.tkre',taskReload);
$(document).on('click','.tkrep',async()=>{if(S.rep\vert{}\vert{}!S.task)return;$('.tkrep').prop('disabled',true).text('Đang gửi...');
  try{const r=await call('report',{name:S.name,lop:S.lop,no:S.task.no});if(r.err)await modal(esc(r.err),'ĐÓNG',null,'!');else{S.rep=r.h;taskSave()}}
  catch(e){await modal('Chưa báo được cho giáo viên. Em hãy thử lại.','ĐÓNG',null,'!')}
  taskPaint()});
function histAdd(r){const c=histCache(),t=S.tests.find(x=>x.id==S.id);if(!c||!t)return;
  const d=new Date();let g=c.find(x=>x.chude===t.chude&&x.test===t.test);const rest=c.filter(x=>x!==g);
  g=g||{chude:t.chude,test:t.test,list:[]};g.list.push({h:pad2(d.getHours())+':'+pad2(d.getMinutes()),got:r.got,kq:r.pass===true?'Đạt':r.pass===false?'Chưa đạt':''});
  LS.set(hkey(S.name,S.lop),{d:today(),g:[g].concat(rest)})}
function histRender(g){const b=$('#hlist');
  if(!g.length){b.html('<p class="text-secondary text-center py-4 mb-0">Hôm nay em chưa nộp bài nào.</p>');return}
  b.html(g.map(x=>`<div class="hgrp"><div class="small text-secondary">${esc(x.chude)}</div><div class="fw-bold mb-1">${esc(x.test)}</div>`+
    x.list.map(a=>`<div class="hrow ${a.kq=='Đạt'?'hok':a.kq=='Chưa đạt'?'hno':''}"><span>${esc(a.h)}</span><span class="fw-semibold">${a.got===''?'—':esc(a.got)+' điểm'}</span>${a.kq?`<span class="badge ${a.kq=='Đạt'?'bg-success':'bg-danger'}">${esc(a.kq)}</span>`:'<span></span>'}</div>`).join('')+'</div>').join(''))}
async function histLoad(){
  const c=histCache();
  if(c)histRender(c);else $('#hlist').html('<div class="text-center text-secondary py-5"><div class="spinner-border spinner-border-sm me-2"></div>Đang tải...</div>');
  const g=await histSync();
  if(g===null){if(!c){$('#hlist').html('<p class="text-danger text-center py-4 mb-2">Không tải được lịch sử.</p><div class="text-center"><button class="btn btn-sm btn-outline-secondary" id="hretry">Thử lại</button></div>');$('#hretry').on('click',histLoad)}return}
  if(!c||JSON.stringify(g)!==JSON.stringify(c))histRender(g)
}

let QUIET=false;
function btState(){const v=S.sel.bt;$('#op').prop('disabled',!v);$('#s3').toggleClass('on',!!v)}
function fillBt(){const b=$('#bt');if(!b.length)return;
  const on=!!S.sel.mon,t=S.task,items=t?t.items:[],cur=S.sel.bt;
  const ph=t===undefined?(S.tkErr?'— Không tải được —':'— Đang tải... —'):!items.length?'— Chưa có bài được giao —':'— Chọn bài —';
  b.prop('disabled',!on||!items.length).html(`<option value="">${ph}</option>`+items.map(x=>`<option value="${x.id}">${esc(x.cd)} - ${esc(x.t)}</option>`).join(''));
  b.val(items.some(x=>String(x.id)===String(cur))?cur:'');S.sel.bt=b.val()||'';btState()}
function selectV(){
  const k=S.khoi;
  view(`${hero}<main class="card card-main"><div class="card-body p-4 p-md-5"><h2 class="fw-bold">Chọn bài test để bắt đầu</h2>
  <p class="text-secondary">Xin chào <b>${esc(S.name)}</b>, lớp ${S.lop}. <a href="#" id="out">Đổi học sinh</a></p>
  <div class="steps"><span class="on" id="s1">1 Chọn môn</span><span id="s2">2 Chọn bài</span><span id="s3">3 Mở bài</span></div>
  <div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label fw-semibold">Môn học</label><select id="mon" class="form-select form-select-lg"><option value="">— Chọn môn —</option><option value="1">IC3 GS6 Spark Level ${k-2} (Khối ${k})</option></select></div>
  <div class="col-md-6"><label class="form-label fw-semibold">Bài test</label><select id="bt" class="form-select form-select-lg" disabled><option value="">— Chọn bài —</option></select></div></div>
  <div class="d-flex justify-content-end mt-4"><button class="btn btn-red btn-lg px-4" id="op" disabled>Mở bài làm</button></div>
  <div class="tkhost mt-4"></div></div></main>`);
  histInit();$('#out').on('click',e=>{e.preventDefault();loginV()});
  $('#mon').on('change',function(){const on=!!this.value;S.sel.mon=on;S.sel.bt='';$('#s2').toggleClass('on',on);fillBt()});
  $('#bt').on('change',async function(){const v=this.value,it=v?taskItem(v):null;
    if(it&&it.ok>=it.times&&!QUIET&&!await modal('Bạn đã hoàn thành nhiệm vụ của test này. Bạn có muốn làm thêm không?','LÀM THÊM','CHỌN TEST KHÁC')){$(this).val('');S.sel.bt='';btState();return}
    S.sel.bt=v;btState()});
  $('#op').on('click',()=>{const v=S.sel.bt;if(v)start(v,$('#bt')[0].selectedOptions[0].text)});
  QUIET=true;if(S.sel.mon){$('#mon').val('1');$('#s2').addClass('on')}taskPaint();QUIET=false;
}
async function start(id,label){
  view(`${hero}<main class="card card-main"><div class="card-body text-center py-5 px-5"><p class="fs-3 fw-bold mb-4">Đang tải dữ liệu...</p>
  <div class="progress" style="height:16px"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div></div></main>`);
  try{const r=await call('getQuiz',{id});r.items=mix(r.items);S.quiz=r;S.id=id;S.sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);S.label=label;S.i=0;S.ans={};S.bm={};quizView()}
  catch(e){await modal('Không tải được bài. Em hãy thử lại sau ít phút.','ĐÓNG',null,'!');selectV()}
}

const done=x=>{const a=S.ans[x.id];return x.t=='hot'?!!(a&&a.length):x.t=='mc'?!!a:x.t=='cb'?!!(a&&a.length):!!(a&&x.r.every(r=>a[r]))};
const oi=(q,j)=>q.oi&&q.oi[j]?`<img class="oimg" title="Bấm để phóng to" src="${q.oi[j]}">`:'';
function body(q){
  const a=S.ans[q.id];
  if(q.t=='hot'){const d=a||[];
    return q.img?`<div class="hotw"><div class="hotb"><img class="hot" src="${q.img}" draggable="false">${d.map((p,j)=>`<i class="dot" data-j="${j}" style="left:${p.x}\%;top:${p.y}%"></i>`).join('')}</div>
    <p class="hint">Bấm vào hình để đánh dấu vị trí, có thể bấm nhiều điểm (đã đánh dấu ${d.length}). Bấm vào chấm tròn để xóa chấm đó.</p></div>`:'<p class="hint">Câu hỏi này chưa có hình.</p>'}
  const c=q.oi?' two':'';
  if(q.t=='mc')return`<div class="opts${c}">`+q.o.map((o,j)=>`<label class="op"><input type="radio" name="r" value="${j}"${a===o?' checked':''}><span>${esc(o)}${oi(q,j)}</span></label>`).join('')+'</div>';
  if(q.t=='cb')return`<div class="opts${c}">`+q.o.map((o,j)=>`<label class="op"><input type="checkbox" value="${j}"${a&&a.includes(o)?' checked':''}><span>${esc(o)}${oi(q,j)}</span></label>`).join('')+'</div>';
  return'<div class="opts">'+q.r.map((r,j)=>`<div class="gr"><select class="form-select" data-j="${j}"><option value="">- Chọn -</option>${q.c.map(x=>`<option${a&&a[r]===x?' selected':''}>${esc(x)}</option>`).join('')}</select><span>${esc(r)}</span></div>`).join('')+'</div>';
}
function quizView(){
  const Q=S.quiz.items,n=Q.length,q=Q[S.i],all=Q.every(done),cnt=Q.filter(done).length;
  const o0=$('.out')[0],sv=o0?o0.scrollTop:0,b0=$('.qbody')[0],sbv=b0&&S.lastI===S.i?b0.scrollTop:0;
  const ti=taskItem(S.id),pr=ti?`<span class="tkw"><span>Đã đạt <b>${ti.ok}/${ti.times}</b> lần (từ ${ti.thr} điểm)</span><span class="progress"><span class="progress-bar bg-success" style="width:${Math.round(ti.ok/ti.times*100)}%"></span></span></span>`:'';
  view(`<div class="bar"><b>${esc(S.label)}</b>${pr}<span><button class="mini" id="fs">Toàn màn hình</button> <button class="mini red" id="cl">Đóng bài</button></span></div>
  <div class="wrap"><section class="qcard"><div class="qh"><span>Câu hỏi ${S.i+1}/${n}</span>${SHOW_BOOKMARK?`<button class="bmk${S.bm[q.id]?' on':''}" id="bm" title="Đánh dấu câu này để xem lại">🔖</button>`:''}</div>
  <div class="qt">${esc(cl(q.q))}</div><div class="qbody">${q.img&&q.t!='hot'?`<img class="qimg" title="Bấm để phóng to" src="${q.img}">`:''}${body(q)}</div>
  <div class="foot"><span>${all?'<button class="btn btn-red btn-lg px-4" id="sub">Nộp bài</button>':`Đã trả lời ${cnt}/${n} câu`}</span>
  <span><button class="btn btn-primary fw-bold" id="pv"${S.i?'':' disabled'}>‹ PREV</button> <button class="btn btn-primary fw-bold" id="nx"${S.i<n-1?'':' disabled'}>NEXT ›</button></span></div></section>
  <aside class="out"><div class="tab">OUTLINE</div>${Q.map((x,j)=>`<div class="it${j==S.i?' cur':''}${done(x)?' done':''}" data-j="${j}"><i>${done(x)?'✓':j+1}</i><span>${esc(cl(x.q)).slice(0,80)}${SHOW_BOOKMARK&&S.bm[x.id]?' 🔖':''}</span></div>`).join('')}</aside></div>`);
  const ol=$('.out')[0];ol.scrollTop=sv;$('.qbody')[0].scrollTop=sbv;S.lastI=S.i;
  const cu=$('.it.cur')[0];if(cu&&(cu.offsetTop<sv\vert{}\vert{}cu.offsetTop+cu.offsetHeight>sv+ol.clientHeight))ol.scrollTop=Math.max(0,cu.offsetTop-ol.clientHeight/2);$('#fs').on('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
  $('#cl').on('click',async()=>{if(await modal('Bạn có muốn đóng bài làm không? Bài làm chưa nộp sẽ bị xóa.','ĐÓNG BÀI','TIẾP TỤC LÀM BÀI'))selectV()});
  $('#bm').on('click',()=>{S.bm[q.id]=!S.bm[q.id];quizView()});
  $('#pv').on('click',()=>{S.i--;quizView()});$('#nx').on('click',()=>{S.i++;quizView()});
  $('.it').on('click',function(){S.i=+$(this).data('j');quizView()});$('.qbody').on('change',e=>{const t=e.target;
    if(q.t=='mc')S.ans[q.id]=q.o[+t.value];
    else if(q.t=='cb')S.ans[q.id]=$('.qbody input:checked').map((_,x)=>q.o[+x.value]).get();
    else if(q.t=='grid'){const a=S.ans[q.id]||{},r=q.r[+$(t).data('j')];if(t.value)a[r]=t.value;else delete a[r];S.ans[q.id]=a}
    quizView()});
  if(q.t=='hot'&&$('.hotb').length){const im=$('img.hot')[0];$('.hotb').on('click',e=>{const a=S.ans[q.id]=S.ans[q.id]||[];
      if($(e.target).hasClass('dot')){a.splice(+$(e.target).data('j'),1);quizView();return}
      if(e.target!==im)return;const r=im.getBoundingClientRect();
      a.push({x:+((e.clientX-r.left)/r.width*100).toFixed(2),y:+((e.clientY-r.top)/r.height*100).toFixed(2)});quizView()})}
  $('#sub').on('click',submit);
}
async function submit(){
  if(S.sending)return;S.sending=true;
  try{
    if(!await modal('Bạn đã trả lời tất cả các câu hỏi. Bạn có muốn nộp bài không?','NỘP BÀI','QUAY LẠI BÀI LÀM'))return;
    const bz=busy();
    try{const r=await call('submit',{name:S.name,lop:S.lop,may:S.sel.may,id:S.id,ans:S.ans,sid:S.sid});bz();
      if(r.err){await modal(esc(r.err),'ĐÓNG',null,'!');quizView();return}
      resultV(r)}
    catch(e){bz();await modal('Chưa nộp được bài. Máy chủ báo lỗi: '+esc((e&&e.message)||e)+'. Em hãy bấm Nộp bài lại; nếu vẫn lỗi, hãy báo giáo viên.','ĐÓNG',null,'!');quizView()}
  }finally{S.sending=false}
}

function resultV(r){
  const ti=taskItem(S.id);if(ti&&r.pass===true&&ti.ok<ti.times){ti.ok++;taskSave()}
  const kind=r.pass===false?'fail':(r.total&&r.got>=r.total)?'top':r.pass===true?'good':'done';
  const T={top:'Bạn quá xuất sắc!',good:'Bạn làm rất tốt!',fail:'Rất tiếc bạn đã không đạt!',done:'Bạn đã hoàn thành bài làm!'}[kind],bad=kind=='fail';
  const icon=bad?'<svg viewBox="0 0 100 100" width="112"><circle cx="50" cy="50" r="48" fill="#f06548"/><path d="M32 32l36 36M68 32L32 68" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>'
    :'<svg viewBox="0 0 100 100" width="112"><circle cx="50" cy="50" r="48" fill="#6cbf1e"/><path d="M28 52l16 16 30-34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const sub=r.thr!=null&&r.thr!==''?`<p class="text-secondary mb-1">Điểm yêu cầu: <b>${r.thr}</b></p>`:'';
  view(`${hero}<main class="card card-main res">${icon}<h2 class="mt-3" style="color:${bad?'#c0504d':'#1f4e8c'}">${T}</h2><p class="fs-3 mb-0">Điểm</p><div class="sc ${bad?'no':'ok'}">${r.got}</div>${sub}
  <p class="text-secondary mb-1">${esc(S.label)}</p>${ti?`<p class="fw-semibold mb-0">Test này: đã đạt <b>${ti.ok}/${ti.times}</b> lần</p>`:''}
  <div class="d-flex gap-3 justify-content-center flex-wrap mt-3"><button class="btn ${bad?'btn-red':'btn-outline-secondary'} btn-lg px-4 fw-bold" id="re">Làm lại bài này</button><button class="btn ${bad?'btn-outline-secondary':'btn-red'} btn-lg px-4 fw-bold" id="ot">Chọn bài khác</button></div>
  <div class="thx">Cảm ơn bạn!</div></main>`);
  $('#re').on('click',()=>start(S.id,S.label));$('#ot').on('click',selectV);histInit();histAdd(r);histSync();
}
loginV();
</script></body></html>
